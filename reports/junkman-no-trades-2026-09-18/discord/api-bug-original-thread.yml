                    - text: NVDA exp=2026-09-18，盘前 08:43 取：snapshot_at 是前一日 09:30， underlying_price_usd 却是当日的 218.61，而 put-call parity 反解报价对应的现价是 213.93， 差 4.68。结果：K=210/215/217.5 的 Call 全是 gamma=0, iv=0, delta=1， K=220 的 C/P gamma 是 0.1362 / 0.0272（同一行权价两侧 gamma 相差 5 倍，理论上必须相等）。 同一条链收盘后再取就全部正常。 看起来是用当前标的价配快照时点（前一日）的报价算的 greeks。 最小解法：补一个 underlying_at_snapshot_usd 字段（快照时点的标的价）， 我自己就能算，不用改你们的计算逻辑。
