                          - generic [ref=e2160]:
                            - text: 本周更新公告： Dealer Vex正式上线，相关文档已经更新完毕。 • GEX 告诉你价格动多少会触发对冲流，VEX 告诉你波动率动多少会触发对冲流。IV 每变化 1 个百分点，做市商在哪个行权价、哪个到期日被迫买入或卖出多少美元——全部实时展示在你熟悉的热图上，GEX / VEX 一键切换。波动率交易者的第二张地图。（API和历史回放之后会上线） Ask APEX 升级： • 看得到所有股票：新增全市场不同ticker的对比，可以直接让Apex对好几个股票的结构进行比较。 • 看得懂"变化"：新增的结构对比能力，可以告诉你"现在和一小时前相比，市场结构发生了什么变化"——墙移了没？射程扩了没？ • 更懂波动率：接入 VEX 情景描述与 IV 条件判读，回答的维度再上一层。 • 更可靠：长回答不再莫名消失，异常提示清晰可见，一键快捷问句"解读一下当前结构"随点随答。 Heatmap 全面提速 • 首屏加载更快、稳定性大幅提升，多开几个标签页也不会再被误伤限流、连接更稳。背后的管道刚刚经历了一轮彻底的性能重构。 开发者体验 • Data API 与 MCP 服务完成一轮可靠性加固：历史回填更稳、错误语义更清晰、降低了大家的额度消耗， 预告：模拟交易（Paper Trading） 多腿价差、保证金账户、实时盯市，AI分析交易记录都已经在最后测试阶段，即将开放敬请期待。
